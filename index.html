 =================================================== -->

 <script>

 (function () {


     /*
      * Telegram URL
      */

     const telegramLink =
         "https://t.me/+7NAbO_qs4-5jNjZl";


     /*
      * Countdown
      */

     let timeLeft = 10;


     /*
      * Countdown element
      */

     const countdownEl =
         document.getElementById(
             "countdown"
         );


     /*
      * Prevent duplicate tracking
      */

     let tracked = false;


     /*
      * ==========================================
      * TRACK SUBSCRIBE
      * ==========================================
      */

     function trackSubscribe(source) {


         /*
          * Don't fire twice
          */

         if (tracked) {

             return;

         }


         tracked = true;


         /*
          * Meta Pixel available?
          */

         if (
             typeof fbq === "function"
         ) {


             /*
              * Custom Subscribe Event
              */

             fbq(
                 "trackCustom",
                 "Subscribe_Click",
                 {

                     platform:
                         "Telegram",

                     source:
                         source,

                     content_name:
                         "Gujarati Trader Telegram",

                     content_category:
                         "Telegram Channel"

                 }
             );


             /*
              * Standard Lead Event
              */

             fbq(
                 "track",
                 "Lead",
                 {

                     content_name:
                         "Gujarati Trader Telegram",

                     content_category:
                         "Telegram Subscribe"

                 }
             );

         }


         /*
          * Save click information
          */

         try {

             localStorage.setItem(
                 "telegram_cta_clicked",
                 "true"
             );


             localStorage.setItem(
                 "telegram_cta_time",
                 Date.now().toString()
             );


             localStorage.setItem(
                 "telegram_cta_source",
                 source
             );

         }

         catch (error) {

             console.log(
                 "LocalStorage unavailable"
             );

         }

     }



     /*
      * ==========================================
      * CTA BUTTON TRACKING
      * ==========================================
      */

     const buttons =
         document.querySelectorAll(
             ".telegram-cta"
         );


     buttons.forEach(
         function(button) {


             button.addEventListener(
                 "click",
                 function() {


                     /*
                      * Track CTA
                      */

                     trackSubscribe(
                         button.getAttribute(
                             "data-cta"
                         ) \
                     );


                     /*
                      * Button feedback
                      */

                     button.classList.add(
                         "tracking"
                     );


                     button.innerHTML =
                         "Opening Telegram...";


                 }
             );

         }
     );



     /*
      * ==========================================
      * 10 SECOND COUNTDOWN
      * ==========================================
      */

     const timer =
         setInterval(
             function() {


                 timeLeft--;


                 /*
                  * Update timer
                  */

                 if (countdownEl) {

                     countdownEl.textContent =
                         timeLeft;

                 }


                 /*
                  * =================================
                  * TIMER FINISHED
                  * =================================
                  */

                 if (timeLeft <= 0) {


                     clearInterval(
                         timer
                     );


                     /*
                      * Show zero
                      */

                     if (countdownEl) {

                         countdownEl.textContent =
                             "0";

                     }


                     /*
                      * Track auto redirect
                      */

                     trackSubscribe(
                         "auto_redirect"
                     );


                     /*
                      * Small delay allows
                      * Pixel event to start
                      */

                     setTimeout(
                         function() {

                             window.location.href =
                                 telegramLink;

                         },
                         150
                     );

                 }


             },
             1000
         );


 })();

 </script>
